name: PA v1.1 continuous validation

on:
  push:
    branches:
      - main
      - codex/continue-development
      - codex/acceptance-hardening-20261103
  pull_request:
    branches:
      - main
      - codex/continue-development

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - name: Install pinned Python runtime and dependencies
        run: uv sync --frozen --python 3.12 --group dev
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests alembic scripts
      - name: Ruff formatting
        run: uv run --no-sync ruff format --check src tests alembic scripts
      - name: Unit and isolated integration tests
        run: uv run --no-sync pytest -q --disable-warnings --tb=short
      - name: Build distributables
        run: uv build
