{% extends "base.html" %}
{% block content %}
<h1>搜索 <small>文本、事件/任务 ID、#编号、URL</small></h1>
<form action="/console/search-page" method="get" class="searchbox big">
  <input type="search" name="q" value="{{ results.query }}" placeholder="例如：登录、01M6…、#12、https://github.com/…">
  <button type="submit">搜索</button>
</form>
{% if results.query %}
<table class="waitlist">
  <thead><tr><th>类型</th><th>标题</th><th>匹配方式</th><th>链接</th></tr></thead>
  <tbody>
  {% for item in results["items"] %}
  <tr>
    <td>{{ item.kind }}</td>
    <td>{{ item.title }}</td>
    <td>{{ item.matched_on }}</td>
    <td>{{ item.id }}</td>
  </tr>
  {% else %}
  <tr><td colspan="4">没有匹配结果。</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endif %}
{% endblock %}
