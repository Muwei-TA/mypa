# skills/sample-code/skill.yaml（PRD v1.1 §7.2 / §7.4）
id: sample-code
name: 代码平台示例
version: 1
enabled: true
rank: 1010
priority: P2
concurrency: 1
timeout_min: 30
mode: code                    # 必须改代码并开 PR
engines:
  - role: dev
allowed_tiers: [A, B]
blocked_commands: [git push --force, rm -rf /]
tools: [read_url, memory_search]
permissions:
  network: allowlist
  network_allow: ["github.com", "*.github.com"]
  fs: workspace_only
  repo_write: true
risk_ceiling: medium
human_gate:
  confidence_below: 0.7
  always_on: [delete_data, stop_service, spend_money, external_message,
              product_direction, secret_change, permission_change]
  use_precedents: true
delivery:
  ui_change_requires_screenshots: true
  draft_must_be_marked: true
communication:
  ack: once
  max_chat_words: 100
budget:
  per_task_tokens: 200000
  per_task_turns: 30
  daily_cny: null
steps: [read_issue, prepare_workspace, change_code, open_pr, wait_ci]
sections: {}
output_schema: default
memory:
  read: [skill:sample-code, global, precedents]
  write: lessons
